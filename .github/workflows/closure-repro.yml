# Rebuild the closure twice in independent pinned builder containers.
name: closure-repro
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_SHA256: f45cde7d3c05032b1dfb3d84627006dc4d4bce38a4e3d0cbd4bd7d36315f8efc
  EXPECTED_BYTES: "15664679"
jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare disk space
        run: |
          df -h
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
          nproc
          free -g
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the closure twice with frozen TeX Live inputs
        run: |
          for run in 1 2; do
            bash scripts/in-builder.sh --network none -- bash -ec '
              export TEXMF_DIST="$TEXLIVE_ROOT/texmf-dist"
              export KPSEWHICH="$TEXLIVE_ROOT/bin/x86_64-linux/kpsewhich"
              export PDFTEX_MAP="$TEXLIVE_ROOT/texmf-var/fonts/map/pdftex/updmap/pdftex.map"
              test -d "$TEXMF_DIST"
              test -x "$KPSEWHICH"
              test -s "$PDFTEX_MAP"
              test "$(sha256sum "$PDFTEX_MAP" | cut -d " " -f 1)" = 77f9f786789230937bcd0b0cf960d43dc315561d886c68a8912e18295b743a9c
              export CLOSURE_STAGING="$PWD/build/closure-repro-$1/staging"
              export CLOSURE_ARCHIVE="$PWD/build/closure-repro-$1/texfiles.tar.gz"
              python3 scripts/derive-closure.py
              git diff --exit-code closure/closure-list.txt
              python3 scripts/materialize-closure.py
              sh scripts/pack-closure.sh
              python3 scripts/check-font-whitelist.py "$CLOSURE_ARCHIVE"
              count=$(find "$CLOSURE_STAGING" -type f | wc -l)
              test "$count" = 1416
            ' bash "$run"
          done
          df -h
          docker system df
      - name: Compare both archives and the recorded baseline
        run: |
          bash scripts/in-builder.sh --network none -- bash -ec '
            first=build/closure-repro-1/texfiles.tar.gz
            second=build/closure-repro-2/texfiles.tar.gz
            cmp "$first" "$second"
            got=$(sha256sum "$first" | cut -d" " -f1)
            bytes=$(stat -c%s "$first")
            printf "closure sha256=%s bytes=%s\n" "$got" "$bytes"
            test "$got" = "$1"
            test "$bytes" = "$2"
          ' bash "$EXPECTED_SHA256" "$EXPECTED_BYTES"
